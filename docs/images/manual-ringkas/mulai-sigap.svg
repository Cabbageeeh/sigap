<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Langkah awal menggunakan SIGAP</title>
  <desc id="desc">Empat langkah pengguna baru: buka alamat sekolah, masuk dengan akun, cek menu sesuai peran, dan mulai tugas utama.</desc>
  <rect width="1100" height="360" rx="28" fill="#fff"/>
  <text x="44" y="56" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#25292a">Mulai menggunakan SIGAP</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(44 98)">
      <rect width="238" height="208" rx="20" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#b94e34"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
      <text x="26" y="95" font-size="20" font-weight="700" fill="#25292a">Buka alamat</text>
      <text x="26" y="126" font-size="16" fill="#67655f">Gunakan tautan</text><text x="26" y="151" font-size="16" fill="#67655f">yang diberikan sekolah.</text>
    </g>
    <path d="M295 202h28" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m317 193 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(338 98)">
      <rect width="238" height="208" rx="20" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#b94e34"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
      <text x="26" y="95" font-size="20" font-weight="700" fill="#25292a">Masuk akun</text>
      <text x="26" y="126" font-size="16" fill="#67655f">Ketik username dan</text><text x="26" y="151" font-size="16" fill="#67655f">kata sandi dari admin.</text>
    </g>
    <path d="M589 202h28" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m611 193 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(632 98)">
      <rect width="198" height="208" rx="20" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#b94e34"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
      <text x="26" y="95" font-size="20" font-weight="700" fill="#25292a">Cek menu</text>
      <text x="26" y="126" font-size="16" fill="#67655f">Menu mengikuti</text><text x="26" y="151" font-size="16" fill="#67655f">peran dan izin.</text>
    </g>
    <path d="M843 202h28" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m865 193 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(886 98)">
      <rect width="170" height="208" rx="20" fill="#f0f6f2" stroke="#c4d9ce" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#287a63"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
      <text x="24" y="95" font-size="20" font-weight="700" fill="#25292a">Mulai</text>
      <text x="24" y="126" font-size="16" fill="#67655f">Ikuti bagian</text><text x="24" y="151" font-size="16" fill="#67655f">sesuai peran.</text>
    </g>
  </g>
</svg>
