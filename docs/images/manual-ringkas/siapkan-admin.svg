<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Urutan penyiapan awal administrator SIGAP</title>
  <desc id="desc">Aktifkan tahun ajaran, siapkan kelas dan roster, tetapkan guru dan jadwal, buat akun serta hak akses, lalu konfigurasi fitur pilihan sekolah.</desc>
  <rect width="1100" height="500" rx="28" fill="#fff"/>
  <text x="44" y="58" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#25292a">Siapkan data inti sebelum guru mulai</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(44 104)"><rect width="300" height="136" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#b94e34"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="76" y="46" font-size="20" font-weight="700" fill="#25292a">Periode Akademik</text><text x="24" y="88" font-size="16" fill="#67655f">Buat dan aktifkan tahun ajaran.</text></g>
    <path d="M352 172h35" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m379 163 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(400 104)"><rect width="300" height="136" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#b94e34"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="76" y="46" font-size="20" font-weight="700" fill="#25292a">Kelas &amp; siswa</text><text x="24" y="88" font-size="16" fill="#67655f">Pastikan roster dan NIS benar.</text></g>
    <path d="M708 172h35" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m735 163 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(756 104)"><rect width="300" height="136" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#b94e34"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="76" y="46" font-size="20" font-weight="700" fill="#25292a">Guru &amp; jadwal</text><text x="24" y="88" font-size="16" fill="#67655f">Atur Data Guru dan Kontrak Mengajar.</text></g>
    <path d="M906 250v40" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m897 283 9 10 9-10" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(756 314)"><rect width="300" height="136" rx="18" fill="#f0f6f2" stroke="#c4d9ce" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#287a63"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="76" y="46" font-size="20" font-weight="700" fill="#25292a">Akun &amp; izin</text><text x="24" y="88" font-size="16" fill="#67655f">Buat pengguna sesuai perannya.</text></g>
    <path d="M708 382h-35" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m681 373-10 9 10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(400 314)"><rect width="300" height="136" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#b94e34"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="76" y="46" font-size="20" font-weight="700" fill="#25292a">Fitur sekolah</text><text x="24" y="88" font-size="16" fill="#67655f">Atur QR dan e-Rapor bila digunakan.</text></g>
    <path d="M352 382h-35" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m325 373-10 9 10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(44 314)"><rect width="300" height="136" rx="18" fill="#fff8ed" stroke="#ead7b7" stroke-width="2"/><path d="m40 28 24 42H16z" fill="#d98a20"/><text x="40" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">✓</text><text x="76" y="46" font-size="20" font-weight="700" fill="#25292a">Cek siap</text><text x="24" y="88" font-size="16" fill="#67655f">Minta guru masuk dan periksa menunya.</text></g>
