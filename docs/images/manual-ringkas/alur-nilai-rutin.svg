<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Alur mengisi nilai rutin SIGAP</title>
  <desc id="desc">Guru memilih kelas, mapel, dan jenis penilaian, mengisi sel tabel siswa, lalu menyimpan perubahan.</desc>
  <rect width="1100" height="300" rx="26" fill="#fff"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#25292a">Catat nilai rutin pada rekap kelas</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(42 86)"><rect width="235" height="162" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="34" cy="34" r="19" fill="#b94e34"/><text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text><text x="24" y="82" font-size="19" font-weight="700" fill="#25292a">Pilih konteks</text><text x="24" y="113" font-size="15" fill="#67655f">Kelas · mapel · jenis</text><text x="24" y="136" font-size="15" fill="#67655f">penilaian.</text></g>
    <path d="M288 166h25" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m307 157 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(330 86)"><rect width="235" height="162" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="34" cy="34" r="19" fill="#b94e34"/><text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text><text x="24" y="82" font-size="19" font-weight="700" fill="#25292a">Lihat rekap</text><text x="24" y="113" font-size="15" fill="#67655f">Muat daftar siswa pada</text><text x="24" y="136" font-size="15" fill="#67655f">kelas yang dipilih.</text></g>
    <path d="M576 166h25" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m595 157 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(618 86)"><rect width="235" height="162" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="34" cy="34" r="19" fill="#b94e34"/><text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text><text x="24" y="82" font-size="19" font-weight="700" fill="#25292a">Isi nilai</text><text x="24" y="113" font-size="15" fill="#67655f">Masukkan nilai 0–100</text><text x="24" y="136" font-size="15" fill="#67655f">dan cek siswa.</text></g>
    <path d="M864 166h25" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m883 157 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(906 86)"><rect width="152" height="162" rx="18" fill="#25292a"/><circle cx="34" cy="34" r="19" fill="#287a63"/><text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text><text x="24" y="82" font-size="19" font-weight="700" fill="#fff">Simpan</text><text x="24" y="113" font-size="14" fill="#e5e1d9">Klik Simpan Semua</text><text x="24" y="136" font-size="14" fill="#e5e1d9">Perubahan.</text></g>
  </g>
</svg>
