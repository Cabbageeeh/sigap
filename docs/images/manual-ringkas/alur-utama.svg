<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Alur utama SIGAP</title><desc id="desc">Admin menyiapkan data, guru mengisi nilai, nilai diekspor ke e-Rapor, lalu sekolah memublikasikan nilai untuk orang tua.</desc>
  <defs><style>.title{font:700 24px Arial,sans-serif;fill:#25292a}.label{font:700 19px Arial,sans-serif;fill:#25292a}.sub{font:16px Arial,sans-serif;fill:#6b6965}.num{font:700 18px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="310" rx="28" fill="#f4f0e9"/>
  <g stroke="#c9c1b5" stroke-width="4" fill="none"><path d="M195 104H1000"/><path d="m986 92 16 12-16 12"/></g>
  <g transform="translate(98 48)"><circle cx="56" cy="56" r="42" fill="#b94e34"/><text class="num" x="56" y="63" text-anchor="middle">1</text><rect x="0" y="114" width="170" height="94" rx="14" fill="#fff"/><text class="label" x="85" y="151" text-anchor="middle">Admin siapkan</text><text class="sub" x="85" y="178" text-anchor="middle">kelas &amp; roster</text></g>
  <g transform="translate(323 48)"><circle cx="56" cy="56" r="42" fill="#b94e34"/><text class="num" x="56" y="63" text-anchor="middle">2</text><rect x="0" y="114" width="170" height="94" rx="14" fill="#fff"/><text class="label" x="85" y="151" text-anchor="middle">Simpan format</text><text class="sub" x="85" y="178" text-anchor="middle">e-Rapor sekolah</text></g>
  <g transform="translate(548 48)"><circle cx="56" cy="56" r="42" fill="#b94e34"/><text class="num" x="56" y="63" text-anchor="middle">3</text><rect x="0" y="114" width="170" height="94" rx="14" fill="#fff"/><text class="label" x="85" y="151" text-anchor="middle">Guru isi nilai</text><text class="sub" x="85" y="178" text-anchor="middle">rutin di SIGAP</text></g>
  <g transform="translate(773 48)"><circle cx="56" cy="56" r="42" fill="#b94e34"/><text class="num" x="56" y="63" text-anchor="middle">4</text><rect x="0" y="114" width="170" height="94" rx="14" fill="#fff"/><text class="label" x="85" y="151" text-anchor="middle">Ekspor</text><text class="sub" x="85" y="178" text-anchor="middle">ke e-Rapor</text></g>
  <g transform="translate(998 48)"><circle cx="56" cy="56" r="42" fill="#25292a"/><text class="num" x="56" y="63" text-anchor="middle">5</text><rect x="0" y="114" width="170" height="94" rx="14" fill="#fff"/><text class="label" x="85" y="151" text-anchor="middle">Publikasikan</text><text class="sub" x="85" y="178" text-anchor="middle">untuk orang tua</text></g>
</svg>
