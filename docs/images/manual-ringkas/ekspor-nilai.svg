<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Alur isi dan ekspor e-Rapor</title><desc id="desc">Guru mengisi nilai rutin, SIGAP memasukkan nilai ke kolom yang dipetakan, guru mengisi sisanya lalu mengunduh file.</desc>
  <defs><style>.h{font:700 19px Arial,sans-serif;fill:#25292a}.p{font:15px Arial,sans-serif;fill:#625f59}</style></defs>
  <rect width="1200" height="310" rx="26" fill="#f4f0e9"/><g stroke="#bdb5a9" stroke-width="4" fill="none"><path d="M274 142h112M574 142h112M874 142h112"/><path d="m372 131 14 11-14 11m300-22 14 11-14 11m300-22 14 11-14 11"/></g>
  <g><rect x="40" y="56" width="235" height="172" rx="18" fill="#fff" stroke="#d6d0c7"/><circle cx="77" cy="94" r="19" fill="#b94e34"/><text x="77" y="101" text-anchor="middle" style="font:700 17px Arial;fill:#fff">1</text><text class="h" x="69" y="143">Nilai rutin</text><text class="p" x="69" y="174">Tugas, kuis, UTS, UAS</text><text class="p" x="69" y="198">di halaman Nilai Siswa</text></g>
  <g><rect x="390" y="56" width="235" height="172" rx="18" fill="#fff" stroke="#d6d0c7"/><circle cx="427" cy="94" r="19" fill="#b94e34"/><text x="427" y="101" text-anchor="middle" style="font:700 17px Arial;fill:#fff">2</text><text class="h" x="419" y="143">Isi otomatis</text><text class="p" x="419" y="174">Kolom template yang</text><text class="p" x="419" y="198">sudah dipetakan</text></g>
  <g><rect x="690" y="56" width="235" height="172" rx="18" fill="#fff" stroke="#d6d0c7"/><circle cx="727" cy="94" r="19" fill="#b94e34"/><text x="727" y="101" text-anchor="middle" style="font:700 17px Arial;fill:#fff">3</text><text class="h" x="719" y="143">Lengkapi</text><text class="p" x="719" y="174">Isi dan simpan kolom</text><text class="p" x="719" y="198">langsung di e-Rapor</text></g>
  <g><rect x="990" y="56" width="170" height="172" rx="18" fill="#25292a"/><circle cx="1027" cy="94" r="19" fill="#b94e34"/><text x="1027" y="101" text-anchor="middle" style="font:700 17px Arial;fill:#fff">4</text><text x="1019" y="143" style="font:700 19px Arial;fill:#fff">Unduh</text><text x="1019" y="174" style="font:15px Arial;fill:#e4dfd8">.xls atau .xlsx</text><text x="1019" y="198" style="font:15px Arial;fill:#e4dfd8">lalu unggah</text></g>
  <text x="600" y="275" text-anchor="middle" style="font:15px Arial;fill:#625f59">Pilih file ekspor sesuai alur unggah e-Rapor yang dipakai sekolah.</text>
</svg>
