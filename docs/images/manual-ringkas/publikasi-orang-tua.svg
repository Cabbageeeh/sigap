<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Publikasi nilai kepada orang tua</title><desc id="desc">Setelah sekolah memublikasikan nilai dari periode akademik, orang tua dapat membuka nilai SIGAP dan nilai resmi e-Rapor yang tersedia.</desc>
  <defs><style>.h{font:700 21px Arial,sans-serif;fill:#25292a}.p{font:16px Arial,sans-serif;fill:#625f59}.white{font:700 17px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="370" rx="26" fill="#f4f0e9"/>
  <rect x="48" y="50" width="420" height="270" rx="22" fill="#fff" stroke="#d6d0c7"/><rect x="80" y="82" width="62" height="62" rx="18" fill="#f2ddd5"/><path d="M97 123v-24h28v24m-35 0h42m-25-24v24" fill="none" stroke="#b94e34" stroke-width="3"/><text class="h" x="80" y="183">Admin / kepala sekolah</text><text class="p" x="80" y="218">Buka Periode Akademik, periksa status</text><text class="p" x="80" y="246">nilai, lalu pilih Publikasikan.</text><rect x="80" y="270" width="210" height="34" rx="10" fill="#25292a"/><text class="white" x="185" y="293" text-anchor="middle">Publikasikan nilai</text>
  <path d="M484 184h204" stroke="#bdb5a9" stroke-width="4"/><path d="m674 172 14 12-14 12" fill="none" stroke="#bdb5a9" stroke-width="4"/>
  <rect x="712" y="50" width="440" height="270" rx="22" fill="#fff" stroke="#d6d0c7"/><circle cx="756" cy="113" r="31" fill="#e3f2ec"/><circle cx="756" cy="105" r="10" fill="#287a63"/><path d="M736 132c4-17 36-17 40 0" fill="#287a63"/><text class="h" x="804" y="119">Orang tua / wali</text><text class="p" x="750" y="179">Setelah publikasi, buka akun orang tua</text><text class="p" x="750" y="207">untuk melihat anak yang terhubung.</text><rect x="750" y="234" width="156" height="52" rx="12" fill="#f7f5f1" stroke="#d6d0c7"/><text class="h" x="828" y="257" text-anchor="middle" style="font-size:16px">Nilai SIGAP</text><text class="p" x="828" y="277" text-anchor="middle" style="font-size:13px">per komponen</text><rect x="922" y="234" width="190" height="52" rx="12" fill="#f7f5f1" stroke="#d6d0c7"/><text class="h" x="1017" y="257" text-anchor="middle" style="font-size:16px">Nilai e-Rapor</text><text class="p" x="1017" y="277" text-anchor="middle" style="font-size:13px">kolom resmi</text>
</svg>
