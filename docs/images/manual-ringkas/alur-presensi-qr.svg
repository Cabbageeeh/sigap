<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Alur konfirmasi kehadiran QR guru</title>
  <desc id="desc">Admin mengaktifkan QR, layar sekolah menampilkan kode yang berotasi, lalu guru memindai kode dan mengizinkan lokasi jika diminta.</desc>
  <rect width="1100" height="300" rx="26" fill="#fff"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#25292a">Kehadiran QR guru (jika diaktifkan sekolah)</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(42 86)"><rect width="300" height="162" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700" fill="#b94e34">ADMIN</text><text x="24" y="83" font-size="19" font-weight="700" fill="#25292a">Aktifkan QR</text><text x="24" y="114" font-size="15" fill="#67655f">Atur interval lalu buka</text><text x="24" y="137" font-size="15" fill="#67655f">Layar QR Absen.</text></g>
    <path d="M354 166h35" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m381 157 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(400 86)"><rect width="300" height="162" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700" fill="#b94e34">LAYAR SEKOLAH</text><text x="24" y="83" font-size="19" font-weight="700" fill="#25292a">Tampilkan kode</text><text x="24" y="114" font-size="15" fill="#67655f">QR berganti sesuai interval</text><text x="24" y="137" font-size="15" fill="#67655f">yang ditentukan sekolah.</text></g>
    <path d="M712 166h35" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m739 157 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(758 86)"><rect width="300" height="162" rx="18" fill="#f0f6f2" stroke="#c4d9ce" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700" fill="#287a63">GURU</text><text x="24" y="83" font-size="19" font-weight="700" fill="#25292a">Pindai QR</text><text x="24" y="114" font-size="15" fill="#67655f">Buka Konfirmasi Kehadiran;</text><text x="24" y="137" font-size="15" fill="#67655f">izinkan lokasi bila diminta.</text></g>
  </g>
</svg>
