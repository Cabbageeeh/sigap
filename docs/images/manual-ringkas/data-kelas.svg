<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Isi file data kelas</title><desc id="desc">Ilustrasi lembar data kelas dengan ID SIGAP, NIS, nama dan kelas siswa, serta kolom kontak orang tua.</desc>
  <defs><style>.head{font:700 20px Arial,sans-serif;fill:#fff}.cell{font:16px Arial,sans-serif;fill:#25292a}.note{font:16px Arial,sans-serif;fill:#54514c}.strong{font:700 17px Arial,sans-serif;fill:#25292a}</style></defs>
  <rect width="1200" height="470" rx="26" fill="#f4f0e9"/>
  <rect x="36" y="38" width="1128" height="238" rx="16" fill="#fff" stroke="#d6d0c7"/>
  <path d="M36 54a16 16 0 0 1 16-16h1096a16 16 0 0 1 16 16v46H36z" fill="#25292a"/>
  <g class="head"><text x="58" y="77">ID Siswa SIGAP</text><text x="265" y="77">NIS</text><text x="390" y="77">Nama Siswa</text><text x="695" y="77">Kelas</text><text x="825" y="77">Nama Orang Tua</text></g>
  <g stroke="#e1ddd6" stroke-width="1"><path d="M36 100H1164M36 158H1164M36 216H1164"/><path d="M242 38v238M367 38v238M670 38v238M798 38v238"/></g>
  <g class="cell"><text x="58" y="136">ID tersimpan</text><text x="265" y="136">NIS siswa</text><text x="390" y="136">Nama yang sudah ada</text><text x="695" y="136">7B</text><text x="825" y="136">(boleh kosong)</text><text x="58" y="194">(kosong untuk baru)</text><text x="265" y="194">NIS asli*</text><text x="390" y="194">Nama siswa*</text><text x="695" y="194">7B</text><text x="825" y="194">(boleh kosong)</text><text x="58" y="252">jangan diubah</text><text x="265" y="252">wajib*</text><text x="390" y="252">wajib*</text><text x="825" y="252">telepon &amp; alamat</text></g>
  <rect x="36" y="304" width="540" height="126" rx="16" fill="#fff" stroke="#e0b8a8"/><circle cx="72" cy="344" r="17" fill="#b94e34"/><path d="m64 344 6 6 11-13" fill="none" stroke="#fff" stroke-width="3"/><text class="strong" x="102" y="350">Data siswa lama</text><text class="note" x="62" y="386">ID SIGAP tetap. Lengkapi atau ubah kolom yang diketahui.</text><text class="note" x="62" y="410">Kolom kosong pada baris lama tidak menghapus data tersimpan.</text>
  <rect x="600" y="304" width="564" height="126" rx="16" fill="#fff" stroke="#d6d0c7"/><circle cx="636" cy="344" r="17" fill="#25292a"/><path d="M636 334v20M626 344h20" stroke="#fff" stroke-width="3"/><text class="strong" x="666" y="350">Siswa baru</text><text class="note" x="626" y="386">Baris baru: ID SIGAP dikosongkan, NIS asli dan nama diisi.</text><text class="note" x="626" y="410">Impor per kelas; data orang tua boleh dilengkapi kemudian.</text>
</svg>
