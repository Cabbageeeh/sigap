<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">Hubungkan data guru ke jadwal</title>
  <desc id="desc">Administrator mengisi data guru, menetapkan kontrak mengajar, membuat jadwal, lalu meminta guru memeriksa kelas yang tersedia.</desc>
  <rect width="1100" height="330" rx="26" fill="#fff"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#25292a">Siapkan akses mengajar</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(40 88)"><rect width="230" height="188" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="35" cy="36" r="20" fill="#b94e34"/><text x="35" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="24" y="91" font-size="19" font-weight="700" fill="#25292a">Data Guru</text><text x="24" y="122" font-size="15" fill="#67655f">Tambahkan identitas</text><text x="24" y="146" font-size="15" fill="#67655f">dan data guru.</text></g>
    <path d="M280 182h25" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m299 173 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(320 88)"><rect width="230" height="188" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="35" cy="36" r="20" fill="#b94e34"/><text x="35" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="24" y="91" font-size="19" font-weight="700" fill="#25292a">Kontrak Mengajar</text><text x="24" y="122" font-size="15" fill="#67655f">Tetapkan kelas dan</text><text x="24" y="146" font-size="15" fill="#67655f">penugasan guru.</text></g>
    <path d="M560 182h25" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m579 173 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(600 88)"><rect width="230" height="188" rx="18" fill="#f8f6f1" stroke="#ded9d0" stroke-width="2"/><circle cx="35" cy="36" r="20" fill="#b94e34"/><text x="35" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="24" y="91" font-size="19" font-weight="700" fill="#25292a">Jadwal Pelajaran</text><text x="24" y="122" font-size="15" fill="#67655f">Pilih tahun, hari, jam,</text><text x="24" y="146" font-size="15" fill="#67655f">kelas, mapel, dan guru.</text></g>
    <path d="M840 182h25" stroke="#b94e34" stroke-width="4" stroke-linecap="round"/><path d="m859 173 10 9-10 9" fill="none" stroke="#b94e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(880 88)"><rect width="180" height="188" rx="18" fill="#f0f6f2" stroke="#c4d9ce" stroke-width="2"/><circle cx="35" cy="36" r="20" fill="#287a63"/><text x="35" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="24" y="91" font-size="19" font-weight="700" fill="#25292a">Guru masuk</text><text x="24" y="122" font-size="15" fill="#67655f">Periksa jadwal dan</text><text x="24" y="146" font-size="15" fill="#67655f">kelas yang muncul.</text></g>
  </g>
</svg>
